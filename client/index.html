    <script>
      // Asks for the game cache while the application script is still on its
      // way. The manifest always; on a visit without the cache in browser
      // storage also the lobby's boot pack ("/"), or the whole cache (any
      // other route: a fight is entered with all of it).
      // CacheManager (assets/player.js) takes them from window.__cacheBoot.
      (function () {
        try {
          var boot = (window.__cacheBoot = {});
          var name = (location.pathname.split("/").filter(Boolean)[0] || "lobby").toLowerCase();
          var get = function (url, cache) {
            return fetch(url, { cache: cache || "default" }).then(function (response) {
              if (!response.ok) throw new Error(url + ": HTTP " + response.status);
              return response;
            });
          };
          // "no-cache": the server is asked whether the manifest is still the
          // one the browser has, however long it may keep it. An old manifest
          // names an old cache (test/test-cache-manifest.mjs).
          boot.manifest = get("/osrs-cache/manifest.json", "no-cache").then(function (response) {
            return response.json();
          });
          // The checksums of the caches CacheDatabase (assets/player.js) keeps.
          var kept = new Promise(function (resolve) {
            var open = indexedDB.open("osrs-yama-cache");
            open.onerror = function () {
              resolve([]);
            };
            open.onsuccess = function () {
              try {
                var read = open.result.transaction("meta").objectStore("meta").getAll();
                read.onsuccess = function () {
                  resolve(read.result.map(function (meta) { return meta.manifestHash; }));
                };
                read.onerror = function () {
                  resolve([]);
                };
              } catch (e) {
                resolve([]);
              }
              open.result.close();
            };
          });
          // CacheManager asks again itself for whatever fails here.
          boot.pack = Promise.all([boot.manifest, kept]).then(function (both) {
            var info = both[0];
            if (!info.diskZipSha256 || both[1].indexOf(info.diskZipSha256) >= 0) return null;
            var entry = info.bootPacks && info.bootPacks[name];
            if (entry) {
              var url = "/osrs-cache/boot/" + name + ".zip?v=" + entry.sha256;
              return get(url)
                .then(function (response) {
                  return response.arrayBuffer();
                })
                .then(function (bytes) {
                  return { url: url, bytes: bytes };
                });
            }
            // The whole cache, counted as it comes in for the loading bar.
            var whole = (boot.whole = { url: "/osrs-cache/disk.zip?v=" + encodeURIComponent(info.diskZipSha256), loaded: 0, onprogress: null });
            whole.bytes = get(whole.url).then(function (response) {
              var reader = response.body.getReader();
              var chunks = [];
              var next = function () {
                return reader.read().then(function (step) {
                  if (step.done) return new Blob(chunks).arrayBuffer();
                  chunks.push(step.value);
                  whole.loaded += step.value.length;
                  if (whole.onprogress) whole.onprogress();
                  return next();
                });
              };
              return next();
            });
            whole.bytes.catch(function () {});
            return null;
          });
          boot.pack.catch(function () {});
        } catch (e) {}
      })();
    </script>
